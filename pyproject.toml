[project]
name = "shiny-kit"
dynamic = ["version"]
description = "Object-oriented PyShiny component architecture, reactive descriptors, introspective widgets, and two-tier model caching"
readme = "README.md"
authors = [
    { name = "Tom Stanton", email = "tomdstanton@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "shiny",
    "htmltools",
    "lucide",
]

[dependency-groups]
docs = [
    "zensical>=0.0.46",
    "mkdocstrings[python]",
    "zenzic>=0.30.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-testmon>=2.1.0",
    "pytest-xdist",
    "pytest-playwright>=0.10.0",
    "pytest-cov>=7.1.0",
]
typing = [
    "ty",
]
lint = [
    "ruff",
    "pre-commit",
]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "lint" },
]

[project.urls]
Homepage = "https://tomdstanton.github.io/shiny-kit/"
Repository = "https://github.com/tomdstanton/shiny-kit"
Documentation = "https://tomdstanton.github.io/shiny-kit/"
"Bug Tracker" = "https://github.com/tomdstanton/shiny-kit/issues"
Changelog = "https://github.com/tomdstanton/shiny-kit/blob/master/CHANGELOG.md"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/shiny_kit/_version.py"

[tool.ruff]
line-length = 120
force-exclude = true
exclude = [
    ".agents",
    ".git",
    ".venv",
    "__pycache__",
    "src/shiny_kit/_version.py",
    "notebooks",
    "scripts",
]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
extend-select = ["ANN", "PYI"]
ignore = [
    "ANN401",
    "E501"
] # Formatting handles line length
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = [".venv", "dist", "build", ".git", ".ruff_cache"]
# Token-saving flags: suppress header/summary noise, truncate tracebacks, silence passing output
addopts = "-q --tb=short --show-capture=no --cov=src --cov-report=term-missing --cov-branch --cov-fail-under=85"
markers = [
    "max_span_ms(span_name, max_duration_ms): Assert span duration budget.",
]

[tool.coverage.run]
omit = ["src/shiny_kit/_version.py"]

[tool.zenzic]
strict = false
fail_under = 60

[tool.zenzic.build_context]
engine         = "zensical"
base_url       = "/"
default_locale = "en"

[tool.zenzic.governance]
suppression_cap           = 30
suppression_cap_fail_hard = true
brand_obsolescence = []

[tool.zenzic.governance.directory_policies]
"docs/**" = ["Z301"]  # mkdocstrings cross-references
"docs/reference/**" = ["Z411", "Z502"]  # autogenerated API stubs

[tool.zenzic.policies]
required_frontmatter_keys = []
forbidden_external_domains = []
forbidden_frontmatter_keys = []
allowed_external_domains = []
required_url_schemes = []
forbidden_content_patterns = []
required_heading_patterns = []
max_document_complexity = 0
weasel_words = []
enable_passive_voice_check = false

[tool.zenzic.network]
cache_ttl_hours = 24
